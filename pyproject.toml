[project]
name = "product-intel"
version = "0.1.0"
description = "Product Intelligence & Experimentation Platform"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "pyarrow",
    "scipy",
    "statsmodels",
    "scikit-learn",
    "pydantic",
    "sqlalchemy",
    "psycopg2-binary",
    "duckdb",
    "pyyaml",
    "python-dotenv",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
ml = ["shap"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["simulator", "pipeline", "analytics", "experiments", "intelligence", "insights"]
